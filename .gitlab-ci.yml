include:
  - component: $CI_SERVER_FQDN/ci-registry/ai-review/ai-review@1.4.0
    inputs:
      review-word-limit: "200"
      additional-prompt: "Please conduct a thorough and critical review of the code. I want you to identify potential mistakes, logical errors, poor coding practices, and areas for improvement. Do not hold back; provide direct and candid feedback."

  - component: $CI_SERVER_FQDN/ci-registry/auto-submodule-update/auto-submodule-update@1.2.0
    inputs:
      extra_before_script:
        - eval "$(ssh-agent -s)"
        - chmod 400 "$SSH_PRIVATE_KEY"
        - ssh-add "$SSH_PRIVATE_KEY"
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan -t rsa git.caslab.ee.ncku.edu.tw >> ~/.ssh/known_hosts
      extra_script:
        - nix flake update

stages:
  - review
  - public-sync
  - test

publish-github-formosa-main:
  stage: public-sync
  image: eclipse-temurin:21-jre-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "formosa/main"
      when: manual
      allow_failure: false
  variables:
    COPYBARA_VERSION: "v20260601"
  before_script:
    - apk add --no-cache bash curl git openssh-client
    - mkdir -p /usr/local/lib
    - curl -fsSL -o /usr/local/lib/copybara_deploy.jar "https://github.com/google/copybara/releases/download/${COPYBARA_VERSION}/copybara_deploy.jar"
    - |
      cat > /usr/local/bin/copybara <<'EOF'
      #!/bin/sh
      exec /opt/java/openjdk/bin/java -jar /usr/local/lib/copybara_deploy.jar "$@"
      EOF
    - chmod +x /usr/local/bin/copybara
    - eval $(ssh-agent -s)
    - test -n "$GITHUB_SSH_PRIVATE_KEY"
    - chmod 400 "$GITHUB_SSH_PRIVATE_KEY"
    - ssh-add "$GITHUB_SSH_PRIVATE_KEY"
    - if [ -n "${SSH_PRIVATE_KEY:-}" ]; then chmod 400 "$SSH_PRIVATE_KEY"; ssh-add "$SSH_PRIVATE_KEY"; fi
    - mkdir -p /etc/ssh
    - chmod 700 /etc/ssh
    - ssh-keyscan -H github.com >> /etc/ssh/ssh_known_hosts
    - ssh-keyscan -H "$CI_SERVER_FQDN" >> /etc/ssh/ssh_known_hosts
    - chmod 644 /etc/ssh/ssh_known_hosts
  script:
    - tmp_home="$(mktemp -d)"
    - git config --file "$tmp_home/.gitconfig" user.name "FORMOSA Copybara Bot"
    - git config --file "$tmp_home/.gitconfig" user.email "copybara@formosa-gpgpu.invalid"
    - HOME="$tmp_home" copybara migrate tools/public_sync/copy.bara.sky public_mirror
