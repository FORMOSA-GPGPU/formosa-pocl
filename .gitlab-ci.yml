include:
  - component: $CI_SERVER_FQDN/ci-registry/ai-review/ai-review@1.4.0
    inputs:
      review-word-limit: "200"
      additional-prompt: "Please conduct a thorough and critical review of the code. I want you to identify potential mistakes, logical errors, poor coding practices, and areas for improvement. Do not hold back; provide direct and candid feedback."

  - component: $CI_SERVER_FQDN/ci-registry/auto-submodule-update/auto-submodule-update@1.2.0
    inputs:
      extra_before_script:
        - eval "$(ssh-agent -s)"
        - chmod 400 "$SSH_PRIVATE_KEY"
        - ssh-add "$SSH_PRIVATE_KEY"
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan -t rsa git.caslab.ee.ncku.edu.tw >> ~/.ssh/known_hosts
      extra_script:
        - nix flake update

stages:
  - review
  - test
